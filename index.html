<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TQ QUEST — Tech City</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #79c9ff;
}

canvas {
    display: block;
}

#hud {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 20;

    min-width: 300px;
    padding: 14px 18px;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            rgba(14, 29, 58, .96),
            rgba(25, 48, 88, .94)
        );

    border: 2px solid rgba(255,255,255,.18);

    box-shadow:
        0 8px 25px rgba(0,0,0,.3);

    color: white;

    font-weight: bold;

    backdrop-filter: blur(8px);
}

#title {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #ffffff;
    margin-bottom: 8px;
}

#title::first-letter {
    color: #ffd43b;

}
#xp,
#coins {
    font-size: 20px;
    color: #ffd43b;
}

#coins {
    color: #ffcf33;
}

#controls {

    position: fixed;

    bottom: 15px;
    left: 15px;

    z-index: 10;

    background: rgba(255,255,255,.9);

    padding: 10px 15px;

    border-radius: 15px;

    font-size: 13px;

    color: #444;

}

#location {
    position: fixed;
    top: 18px;
    right: 18px;

    z-index: 20;

    padding: 11px 18px;

    border-radius: 14px;

    background:
        rgba(14, 29, 58, .94);

    border: 2px solid rgba(255,255,255,.15);

    box-shadow:
        0 6px 20px rgba(0,0,0,.25);

    color: white;

    font-size: 15px;
    font-weight: 900;

    letter-spacing: 1px;
}

/* ========================================
   CHARACTER SELECTION
======================================== */

#characterSelect {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at 50% 30%, #243f78 0%, #101a38 45%, #070c1c 100%);
    color: white;
    font-family: Arial, sans-serif;
}

#characterSelect .selectBox {
    width: min(1100px, 94vw);
    padding: 35px;
    text-align: center;
}

.gameLogo {
    font-size: clamp(42px, 7vw, 78px);
    font-weight: 900;
    letter-spacing: -3px;
    text-shadow: 4px 5px 0 #17213d;
}

.gameLogo span {
    color: #ff3d32;
}

.tagline {
    margin-top: 5px;
    font-size: 16px;
    letter-spacing: 4px;
    color: #d8e5ff;
}

.chooseTitle {
    margin: 35px 0 20px;
    font-size: 28px;
    font-weight: 800;
}

.characterGrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.characterCard {
    position: relative;
    min-height: 360px;
    padding: 12px;
    border: 3px solid rgba(255,255,255,.15);
    border-radius: 24px;
    background: rgba(255,255,255,.08);
    cursor: pointer;
    transition: .2s ease;
    overflow: hidden;
}

.characterCard:hover {
    transform: translateY(-8px);
    background: rgba(255,255,255,.14);
    border-color: white;
}

.characterCard.selected {
    transform: translateY(-8px);
    border-color: #ffd43b;
    box-shadow: 0 0 30px rgba(255,212,59,.45);
    background: rgba(255,212,59,.12);
}

.characterCard img {
    width: 100%;
    height: 270px;
    object-fit: contain;
}

.characterName {
    font-size: 22px;
    font-weight: 800;
    margin-top: 5px;
}

.characterRole {
    font-size: 13px;
    color: #cbd6ef;
    margin-top: 4px;
}

#startQuest {
    margin-top: 28px;
    padding: 16px 48px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #ffcf33, #ff8c22);
    color: #1d2333;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 6px 0 #a95d12;
}

#startQuest:hover {
    transform: translateY(-2px);
}

@media (max-width: 800px) {
    .characterGrid {
        grid-template-columns: repeat(2, 1fr);
    }

    .characterCard {
        min-height: 280px;
    }

    .characterCard img {
        height: 190px;
    }
}
</style>
</head>

<body>
<!-- ========================================
     CHARACTER SELECTION SCREEN
======================================== -->

<div id="characterSelect">

    <div class="selectBox">

        <div class="gameLogo">
            TQ <span>QUEST</span>
        </div>

        <div class="tagline">
            LEARN • ENJOY • LEVEL UP
        </div>

        <div class="chooseTitle">
            CHOOSE YOUR HERO
        </div>

        <div class="characterGrid">

            <div class="characterCard" data-character="seth">
                <img src="Seth.png" alt="Seth">
                <div class="characterName">
                    Seth
                </div>
                <div class="characterRole">
                    Strategist
                </div>
            </div>

            <div class="characterCard" data-character="sarah">
                <img src="Sarah.png" alt="Sarah">
                <div class="characterName">
                    Sarah
                </div>
                <div class="characterRole">
                    Supporter
                </div>
            </div>

            <div class="characterCard" data-character="annie">
                <img src="Annie.png" alt="Annie">
                <div class="characterName">
                    Annie
                </div>
                <div class="characterRole">
                    Analyst
                </div>
            </div>

            <div class="characterCard" data-character="archie">
                <img src="Archie.png" alt="Archie">
                <div class="characterName">
                    Archie
                </div>
                <div class="characterRole">
                    Achiever
                </div>
            </div>

        </div>

        <button id="startQuest" type="button">
            START QUEST
        </button>

    </div>

</div>
<div id="hud">

    <div id="title">
        🎮 TQ QUEST
    </div>

    ⭐ XP:
    <span id="xp">0</span>

    &nbsp;&nbsp;

    🪙 Coins:
    <span id="coins">0</span>

</div>

<div id="location">
    🏙️ TECH CITY
</div>

<div id="controls">
    ⌨️ WASD / Arrow Keys to move
</div>

<canvas id="game"></canvas>

<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


// ========================================
// CANVAS
// ========================================

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


// ========================================
// WORLD
// ========================================

const WORLD_WIDTH = 2400;
const WORLD_HEIGHT = 1800;


// ========================================
// CAMERA
// ========================================

const camera = {

    x: 0,
    y: 0

};


// ========================================
// PLAYER
// ========================================

const player = {

    x: 1200,
    y: 900,

    size: 34,

    speed: 5

};
    
// ========================================
// TQ QUEST CHARACTER IMAGES
// ========================================

const characterImages = {
    seth: new Image(),
    sarah: new Image(),
    annie: new Image(),
    archie: new Image()
};

characterImages.seth.src = "Seth.png";
characterImages.sarah.src = "Sarah.png";
characterImages.annie.src = "Annie.png";
characterImages.archie.src = "Archie.png";

// ========================================
// GAME DATA
// ========================================

let xp = 0;
let coins = 0;


// ========================================
// KEYBOARD
// ========================================

const keys = {};

window.addEventListener(
    "keydown",
    function(event) {

        keys[event.key.toLowerCase()] = true;

    }
);

window.addEventListener(
    "keyup",
    function(event) {

        keys[event.key.toLowerCase()] = false;

    }
);


// ========================================
// BUILDINGS
// ========================================

const buildings = [

    {
        x: 1010,
        y: 400,
        w: 380,
        h: 230,
        color: "#ffcc66",
        roof: "#ff8a5b",
        name: "TRAINING HQ",
        icon: "🏢"
    },

    {
        x: 400,
        y: 650,
        w: 300,
        h: 220,
        color: "#ff8fcf",
        roof: "#e84f9d",
        name: "TQ SHOP",
        icon: "🏪"
    },

    {
        x: 1700,
        y: 650,
        w: 320,
        h: 220,
        color: "#75d6ff",
        roof: "#3498db",
        name: "POWER STATION",
        icon: "⚡"
    },

    {
        x: 400,
        y: 1150,
        w: 330,
        h: 230,
        color: "#9fe58b",
        roof: "#55b948",
        name: "TRAINING CENTER",
        icon: "🧠"
    },

    {
        x: 1650,
        y: 1150,
        w: 370,
        h: 240,
        color: "#b89cff",
        roof: "#7856d6",
        name: "BATTLE ARENA",
        icon: "🏆"
    }

];


// ========================================
// TREES
// ========================================

const trees = [

    [180,180],
    [350,300],
    [600,180],
    [900,200],
    [1500,190],
    [1900,250],
    [2200,200],

    [180,1000],
    [300,1500],
    [800,1500],
    [1100,1450],
    [1450,1500],
    [2100,1500],
    [2250,1100]

];


// ========================================
// DRAW WORLD
// ========================================

function drawWorld() {
    // =========================
    // GRASS BASE
    // =========================
    ctx.fillStyle = "#6fbd68";
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);

    // Soft grass patches
    ctx.fillStyle = "rgba(255,255,255,0.035)";

    for (let x = 40; x < WORLD_W; x += 180) {
        for (let y = 40; y < WORLD_H; y += 150) {
            ctx.fillRect(x, y, 90, 55);
        }
    }

    // =========================
    // ROADS
    // =========================

    // Main horizontal roads
    ctx.fillStyle = "#414b5b";

    ctx.fillRect(0, 300, WORLD_W, 110);
    ctx.fillRect(0, 880, WORLD_W, 110);
    ctx.fillRect(0, 1430, WORLD_W, 110);

    // Main vertical roads
    ctx.fillRect(250, 0, 110, WORLD_H);
    ctx.fillRect(1120, 0, 110, WORLD_H);
    ctx.fillRect(1530, 0, 110, WORLD_H);
    ctx.fillRect(2050, 0, 110, WORLD_H);

    // =========================
    // SIDEWALKS
    // =========================

    ctx.fillStyle = "#d7d9d6";

    // Horizontal sidewalks
    ctx.fillRect(0, 285, WORLD_W, 15);
    ctx.fillRect(0, 410, WORLD_W, 15);

    ctx.fillRect(0, 865, WORLD_W, 15);
    ctx.fillRect(0, 990, WORLD_W, 15);

    ctx.fillRect(0, 1415, WORLD_W, 15);
    ctx.fillRect(0, 1540, WORLD_W, 15);

    // Vertical sidewalks
    ctx.fillRect(235, 0, 15, WORLD_H);
    ctx.fillRect(360, 0, 15, WORLD_H);

    ctx.fillRect(1105, 0, 15, WORLD_H);
    ctx.fillRect(1230, 0, 15, WORLD_H);

    ctx.fillRect(1515, 0, 15, WORLD_H);
    ctx.fillRect(1640, 0, 15, WORLD_H);

    ctx.fillRect(2035, 0, 15, WORLD_H);
    ctx.fillRect(2160, 0, 15, WORLD_H);

    // =========================
    // ROAD LANE MARKINGS
    // =========================

    ctx.fillStyle = "#f7d85a";

    // Horizontal lane markings
    for (let x = 0; x < WORLD_W; x += 80) {
        ctx.fillRect(x, 353, 42, 5);
        ctx.fillRect(x, 933, 42, 5);
        ctx.fillRect(x, 1483, 42, 5);
    }

    // Vertical lane markings
    for (let y = 0; y < WORLD_H; y += 80) {
        ctx.fillRect(303, y, 5, 42);
        ctx.fillRect(1173, y, 5, 42);
        ctx.fillRect(1583, y, 5, 42);
        ctx.fillRect(2103, y, 5, 42);
    }

    // =========================
    // SMALL GRASS DETAILS
    // =========================

    ctx.strokeStyle = "rgba(35,100,45,0.28)";
    ctx.lineWidth = 2;

    for (let x = 70; x < WORLD_W; x += 120) {
        for (let y = 80; y < WORLD_H; y += 110) {

            // Don't clutter the roads
            const onHorizontalRoad =
                (y > 280 && y < 430) ||
                (y > 860 && y < 1000) ||
                (y > 1410 && y < 1550);

            const onVerticalRoad =
                (x > 225 && x < 380) ||
                (x > 1095 && x < 1250) ||
                (x > 1505 && x < 1660) ||
                (x > 2025 && x < 2180);

            if (!onHorizontalRoad && !onVerticalRoad) {
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + 4, y - 8);
                ctx.moveTo(x + 6, y);
                ctx.lineTo(x + 10, y - 7);
                ctx.stroke();
            }
        }
    }

    // =========================
    // CROSSWALKS
    // =========================

    ctx.fillStyle = "rgba(255,255,255,0.72)";

    // Central intersections
    const intersections = [
        [250, 300],
        [1120, 300],
        [1530, 300],
        [2050, 300],
        [250, 880],
        [1120, 880],
        [1530, 880],
        [2050, 880],
        [250, 1430],
        [1120, 1430],
        [1530, 1430],
        [2050, 1430]
    ];

    intersections.forEach(function(point) {
        const x = point[0];
        const y = point[1];

        for (let i = 0; i < 5; i++) {
            ctx.fillRect(
                x - 55 + i * 22,
                y - 60,
                12,
                32
            );

            ctx.fillRect(
                x - 55 + i * 22,
                y + 28,
                12,
                32
            );
        }
    });

    // =========================
    // CITY DECOR
    // =========================

    // Street lamps
    const lamps = [
        [180, 500],
        [500, 500],
        [850, 500],
        [1450, 500],
        [1800, 500],
        [2250, 500],

        [180, 1080],
        [800, 1080],
        [1450, 1080],
        [1850, 1080],
        [2250, 1080],

        [180, 1620],
        [800, 1620],
        [1450, 1620],
        [1850, 1620],
        [2250, 1620]
    ];

    lamps.forEach(function(lamp) {
        const x = lamp[0];
        const y = lamp[1];

        // pole
        ctx.fillStyle = "#3a4250";
        ctx.fillRect(x - 3, y - 28, 6, 28);

        // light
        ctx.fillStyle = "#ffe98a";
        ctx.beginPath();
        ctx.arc(x, y - 32, 8, 0, Math.PI * 2);
        ctx.fill();

        // glow
        ctx.fillStyle = "rgba(255,233,138,0.12)";
        ctx.beginPath();
        ctx.arc(x, y - 32, 22, 0, Math.PI * 2);
        ctx.fill();
    });

    // =========================
    // BUILDINGS
    // =========================

    buildings.forEach(drawBuilding);

    // =========================
    // TREES
    // =========================

    trees.forEach(function(tree) {
        drawTree(tree.x, tree.y);
    });
}


// ========================================
// BUILDING
// ========================================

function drawBuilding(building) {
    // Building shadow
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.fillRect(
        building.x + 10,
        building.y + 14,
        building.w,
        building.h
    );

    // Main building
    ctx.fillStyle = building.color || "#4f6fae";
    ctx.fillRect(
        building.x,
        building.y,
        building.w,
        building.h
    );

    // Building top / roof
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    ctx.fillRect(
        building.x,
        building.y,
        building.w,
        28
    );

    // Roof highlight
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    ctx.fillRect(
        building.x + 8,
        building.y + 8,
        building.w - 16,
        5
    );

    // Windows
    const windowWidth = 32;
    const windowHeight = 25;
    const gapX = 18;
    const gapY = 18;

    for (
        let wx = building.x + 22;
        wx < building.x + building.w - 35;
        wx += windowWidth + gapX
    ) {
        for (
            let wy = building.y + 50;
            wy < building.y + building.h - 70;
            wy += windowHeight + gapY
        ) {
            // Window frame
            ctx.fillStyle = "rgba(10,25,50,0.35)";
            ctx.fillRect(wx - 3, wy - 3, windowWidth + 6, windowHeight + 6);

            // Glass
            ctx.fillStyle = "#8ed8ff";
            ctx.fillRect(wx, wy, windowWidth, windowHeight);

            // Glass shine
            ctx.fillStyle = "rgba(255,255,255,0.45)";
            ctx.fillRect(wx + 5, wy + 4, 7, windowHeight - 8);
        }
    }

    // Main entrance
    const doorWidth = 48;
    const doorHeight = 58;
    const doorX = building.x + building.w / 2 - doorWidth / 2;
    const doorY = building.y + building.h - doorHeight;

    ctx.fillStyle = "#17243d";
    ctx.fillRect(doorX, doorY, doorWidth, doorHeight);

    ctx.fillStyle = "#6fc9ff";
    ctx.fillRect(doorX + 7, doorY + 7, doorWidth - 14, doorHeight - 7);

    // Door handle
    ctx.fillStyle = "#ffd43b";
    ctx.beginPath();
    ctx.arc(
        doorX + doorWidth - 11,
        doorY + doorHeight / 2,
        3,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Sign background
    ctx.fillStyle = "rgba(255,255,255,0.96)";
    ctx.fillRect(
        building.x + 14,
        building.y + building.h - 34,
        building.w - 28,
        27
    );

    // Sign text
    ctx.fillStyle = "#17243d";
    ctx.font = "bold 15px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        building.icon + " " + building.name,
        building.x + building.w / 2,
        building.y + building.h - 20
    );

    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
}


// ========================================
// TREE
// ========================================

function drawTree(x,y) {

    // SHADOW

    ctx.fillStyle =
        "rgba(0,0,0,.15)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y + 40,
        38,
        15,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // TRUNK

    ctx.fillStyle =
        "#8b5a35";

    ctx.fillRect(
        x - 9,
        y + 5,
        18,
        45
    );


    // TREE TOP

    ctx.fillStyle =
        "#3fae55";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        38,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle =
        "#55c967";

    ctx.beginPath();

    ctx.arc(
        x - 18,
        y - 10,
        25,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


// ========================================
// PLAYER
// ========================================

function drawPlayer() {

    const x = player.x;
    const y = player.y;

    // PLAYER SHADOW
    ctx.fillStyle = "rgba(0,0,0,.25)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y + 10,
        38,
        14,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // SELECTED CHARACTER
    const hero = characterImages[selectedCharacter];

    if (hero && hero.complete && hero.naturalWidth > 0) {

        const width = 90;
        const height = 135;

        ctx.drawImage(
            hero,
            x - width / 2,
            y - height + 12,
            width,
            height
        );

    } else {

        // Temporary fallback while image loads
        ctx.fillStyle = "#6c3cff";

        ctx.beginPath();

        ctx.arc(
            x,
            y - 25,
            20,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

    // PLAYER NAME
    const names = {
        seth: "Seth",
        sarah: "Sarah",
        annie: "Annie",
        archie: "Archie"
    };

    ctx.fillStyle = "#ffffff";

    ctx.font = "bold 15px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
        names[selectedCharacter] || "Hero",
        x,
        y + 32
    );
}


// ========================================
// UPDATE PLAYER
// ========================================

function updatePlayer() {

    if (
        keys["w"] ||
        keys["arrowup"]
    ) {

        player.y -=
            player.speed;

    }

    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {

        player.y +=
            player.speed;

    }

    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        player.x -=
            player.speed;

    }

    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        player.x +=
            player.speed;

    }


    // WORLD BOUNDARIES

    player.x =
        Math.max(
            30,
            Math.min(
                WORLD_WIDTH - 30,
                player.x
            )
        );

    player.y =
        Math.max(
            30,
            Math.min(
                WORLD_HEIGHT - 30,
                player.y
            )
        );


    // CAMERA FOLLOW

    camera.x =
        player.x -
        canvas.width / 2;

    camera.y =
        player.y -
        canvas.height / 2;


    // CAMERA LIMITS

    camera.x =
        Math.max(
            0,
            Math.min(
                WORLD_WIDTH -
                canvas.width,
                camera.x
            )
        );

    camera.y =
        Math.max(
            0,
            Math.min(
                WORLD_HEIGHT -
                canvas.height,
                camera.y
            )
        );

}


// ========================================
// DRAW
// ========================================

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.save();


    // CAMERA

    ctx.translate(
        -camera.x,
        -camera.y
    );


    drawWorld();

    drawPlayer();


    ctx.restore();

}


// ========================================
// GAME LOOP
// ========================================

function gameLoop() {

    updatePlayer();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


/* ========================================
   TQ QUEST — HERO SELECTION
======================================== */

let selectedCharacter = "";

const characterCards = document.querySelectorAll(".characterCard");
const characterSelect = document.getElementById("characterSelect");
const startQuestButton = document.getElementById("startQuest");

characterCards.forEach(function(card) {

    card.addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        // Remove previous selection
        characterCards.forEach(function(otherCard) {
            otherCard.classList.remove("selected");
        });

        // Select this hero
        card.classList.add("selected");

        // Save selected hero
        selectedCharacter = card.getAttribute("data-character");

        console.log("Selected hero:", selectedCharacter);

    });

});


startQuestButton.addEventListener("click", function(event) {

    event.preventDefault();
    event.stopPropagation();

    // Make sure a hero was selected
    if (!selectedCharacter) {

        alert("Please choose your hero first!");

        return;

    }

    console.log("Starting TQ QUEST as:", selectedCharacter);

    // Hide character selection
    characterSelect.style.display = "none";

    // Make sure the game is visible
    canvas.style.display = "block";

});
gameLoop();
</script>

</body>
</html>
