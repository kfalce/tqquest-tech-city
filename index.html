<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TQ QUEST — Tech City</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #79c9ff;
}

canvas {
    display: block;
}

#hud {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 20;

    min-width: 300px;
    padding: 14px 18px;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            rgba(14, 29, 58, .96),
            rgba(25, 48, 88, .94)
        );

    border: 2px solid rgba(255,255,255,.18);

    box-shadow:
        0 8px 25px rgba(0,0,0,.3);

    color: white;

    font-weight: bold;

    backdrop-filter: blur(8px);
}

#title {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #ffffff;
    margin-bottom: 8px;
}

#title::first-letter {
    color: #ffd43b;

}
#xp,
#coins {
    font-size: 20px;
    color: #ffd43b;
}

#coins {
    color: #ffcf33;
}

#controls {

    position: fixed;

    bottom: 15px;
    left: 15px;

    z-index: 10;

    background: rgba(255,255,255,.9);

    padding: 10px 15px;

    border-radius: 15px;

    font-size: 13px;

    color: #444;

}

#location {
    position: fixed;
    top: 18px;
    right: 18px;

    z-index: 20;

    padding: 11px 18px;

    border-radius: 14px;

    background:
        rgba(14, 29, 58, .94);

    border: 2px solid rgba(255,255,255,.15);

    box-shadow:
        0 6px 20px rgba(0,0,0,.25);

    color: white;

    font-size: 15px;
    font-weight: 900;

    letter-spacing: 1px;
}

/* ========================================
   CHARACTER SELECTION
======================================== */

#characterSelect {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at 50% 30%, #243f78 0%, #101a38 45%, #070c1c 100%);
    color: white;
    font-family: Arial, sans-serif;
}

#characterSelect .selectBox {
    width: min(1100px, 94vw);
    padding: 35px;
    text-align: center;
}

.gameLogo {
    font-size: clamp(42px, 7vw, 78px);
    font-weight: 900;
    letter-spacing: -3px;
    text-shadow: 4px 5px 0 #17213d;
}

.gameLogo span {
    color: #ff3d32;
}

.tagline {
    margin-top: 5px;
    font-size: 16px;
    letter-spacing: 4px;
    color: #d8e5ff;
}

.chooseTitle {
    margin: 35px 0 20px;
    font-size: 28px;
    font-weight: 800;
}

.characterGrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.characterCard {
    position: relative;
    min-height: 360px;
    padding: 12px;
    border: 3px solid rgba(255,255,255,.15);
    border-radius: 24px;
    background: rgba(255,255,255,.08);
    cursor: pointer;
    transition: .2s ease;
    overflow: hidden;
}

.characterCard:hover {
    transform: translateY(-8px);
    background: rgba(255,255,255,.14);
    border-color: white;
}

.characterCard.selected {
    transform: translateY(-8px);
    border-color: #ffd43b;
    box-shadow: 0 0 30px rgba(255,212,59,.45);
    background: rgba(255,212,59,.12);
}

.characterCard img {
    width: 100%;
    height: 270px;
    object-fit: contain;
}

.characterName {
    font-size: 22px;
    font-weight: 800;
    margin-top: 5px;
}

.characterRole {
    font-size: 13px;
    color: #cbd6ef;
    margin-top: 4px;
}

#startQuest {
    margin-top: 28px;
    padding: 16px 48px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #ffcf33, #ff8c22);
    color: #1d2333;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 6px 0 #a95d12;
}

#startQuest:hover {
    transform: translateY(-2px);
}

@media (max-width: 800px) {
    .characterGrid {
        grid-template-columns: repeat(2, 1fr);
    }

    .characterCard {
        min-height: 280px;
    }

    .characterCard img {
        height: 190px;
    }
}
</style>
</head>

<body>
<!-- ========================================
     CHARACTER SELECTION SCREEN
======================================== -->

<div id="characterSelect">

    <div class="selectBox">

        <div class="gameLogo">
            TQ <span>QUEST</span>
        </div>

        <div class="tagline">
            LEARN • ENJOY • LEVEL UP
        </div>

        <div class="chooseTitle">
            CHOOSE YOUR HERO
        </div>

        <div class="characterGrid">

            <div class="characterCard" data-character="seth">
                <img src="Seth.png" alt="Seth">
                <div class="characterName">
                    Seth
                </div>
                <div class="characterRole">
                    Strategist
                </div>
            </div>

            <div class="characterCard" data-character="sarah">
                <img src="Sarah.png" alt="Sarah">
                <div class="characterName">
                    Sarah
                </div>
                <div class="characterRole">
                    Supporter
                </div>
            </div>

            <div class="characterCard" data-character="annie">
                <img src="Annie.png" alt="Annie">
                <div class="characterName">
                    Annie
                </div>
                <div class="characterRole">
                    Analyst
                </div>
            </div>

            <div class="characterCard" data-character="archie">
                <img src="Archie.png" alt="Archie">
                <div class="characterName">
                    Archie
                </div>
                <div class="characterRole">
                    Achiever
                </div>
            </div>

        </div>

        <button id="startQuest" type="button">
            START QUEST
        </button>

    </div>

</div>
<div id="hud">

    <div id="title">
        🎮 TQ QUEST
    </div>

    ⭐ XP:
    <span id="xp">0</span>

    &nbsp;&nbsp;

    🪙 Coins:
    <span id="coins">0</span>

</div>

<div id="location">
    🏙️ TECH CITY
</div>

<div id="controls">
    ⌨️ WASD / Arrow Keys to move
</div>

<canvas id="game"></canvas>

<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


// ========================================
// CANVAS
// ========================================

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


// ========================================
// WORLD
// ========================================

const WORLD_WIDTH = 2400;
const WORLD_HEIGHT = 1800;


// ========================================
// CAMERA
// ========================================

const camera = {

    x: 0,
    y: 0

};


// ========================================
// PLAYER
// ========================================

const player = {

    x: 1200,
    y: 900,

    size: 34,

    speed: 5

};
    
// ========================================
// TQ QUEST CHARACTER IMAGES
// ========================================

const characterImages = {
    seth: new Image(),
    sarah: new Image(),
    annie: new Image(),
    archie: new Image()
};

characterImages.seth.src = "Seth.png";
characterImages.sarah.src = "Sarah.png";
characterImages.annie.src = "Annie.png";
characterImages.archie.src = "Archie.png";

// ========================================
// GAME DATA
// ========================================

let xp = 0;
let coins = 0;


// ========================================
// KEYBOARD
// ========================================

const keys = {};

window.addEventListener(
    "keydown",
    function(event) {

        keys[event.key.toLowerCase()] = true;

    }
);

window.addEventListener(
    "keyup",
    function(event) {

        keys[event.key.toLowerCase()] = false;

    }
);


// ========================================
// BUILDINGS
// ========================================

const buildings = [

    {
        x: 1010,
        y: 400,
        w: 380,
        h: 230,
        color: "#ffcc66",
        roof: "#ff8a5b",
        name: "TRAINING HQ",
        icon: "🏢"
    },

    {
        x: 400,
        y: 650,
        w: 300,
        h: 220,
        color: "#ff8fcf",
        roof: "#e84f9d",
        name: "TQ SHOP",
        icon: "🏪"
    },

    {
        x: 1700,
        y: 650,
        w: 320,
        h: 220,
        color: "#75d6ff",
        roof: "#3498db",
        name: "POWER STATION",
        icon: "⚡"
    },

    {
        x: 400,
        y: 1150,
        w: 330,
        h: 230,
        color: "#9fe58b",
        roof: "#55b948",
        name: "TRAINING CENTER",
        icon: "🧠"
    },

    {
        x: 1650,
        y: 1150,
        w: 370,
        h: 240,
        color: "#b89cff",
        roof: "#7856d6",
        name: "BATTLE ARENA",
        icon: "🏆"
    }

];


// ========================================
// TREES
// ========================================

const trees = [

    [180,180],
    [350,300],
    [600,180],
    [900,200],
    [1500,190],
    [1900,250],
    [2200,200],

    [180,1000],
    [300,1500],
    [800,1500],
    [1100,1450],
    [1450,1500],
    [2100,1500],
    [2250,1100]

];


// ========================================
// DRAW WORLD
// ========================================

function drawWorld() {

    // GRASS

    ctx.fillStyle =
        "#8ed081";

    ctx.fillRect(
        0,
        0,
        WORLD_WIDTH,
        WORLD_HEIGHT
    );


    // LIGHTER GRASS PATCHES

    ctx.fillStyle =
        "#a5df91";

    for (
        let x = 0;
        x < WORLD_WIDTH;
        x += 300
    ) {

        for (
            let y = 0;
            y < WORLD_HEIGHT;
            y += 300
        ) {

            ctx.fillRect(
                x,
                y,
                150,
                150
            );

        }

    }


    // MAIN ROADS

    ctx.fillStyle =
        "#d9d9d9";

    // Horizontal

    ctx.fillRect(
        0,
        820,
        WORLD_WIDTH,
        160
    );

    // Vertical

    ctx.fillRect(
        1120,
        0,
        160,
        WORLD_HEIGHT
    );


    // ROAD CENTER LINES

    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth = 8;

    ctx.setLineDash([
        35,
        25
    ]);


    ctx.beginPath();

    ctx.moveTo(
        0,
        900
    );

    ctx.lineTo(
        WORLD_WIDTH,
        900
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        1200,
        0
    );

    ctx.lineTo(
        1200,
        WORLD_HEIGHT
    );

    ctx.stroke();


    ctx.setLineDash([]);


    // SIDEWALKS

    ctx.fillStyle =
        "#eeeeee";

    ctx.fillRect(
        0,
        805,
        WORLD_WIDTH,
        15
    );

    ctx.fillRect(
        0,
        980,
        WORLD_WIDTH,
        15
    );

    ctx.fillRect(
        1105,
        0,
        15,
        WORLD_HEIGHT
    );

    ctx.fillRect(
        1280,
        0,
        15,
        WORLD_HEIGHT
    );


    // BUILDINGS

    buildings.forEach(
        drawBuilding
    );


    // TREES

    trees.forEach(
        tree => drawTree(
            tree[0],
            tree[1]
        )
    );

}


// ========================================
// BUILDING
// ========================================

function drawBuilding(building) {

    const {

        x,
        y,
        w,
        h,
        color,
        roof,
        name,
        icon

    } = building;


    // SHADOW

    ctx.fillStyle =
        "rgba(0,0,0,.18)";

    ctx.fillRect(
        x + 12,
        y + 14,
        w,
        h
    );


    // BUILDING

    ctx.fillStyle =
        color;

    ctx.fillRect(
        x,
        y,
        w,
        h
    );


    // ROOF

    ctx.fillStyle =
        roof;

    ctx.beginPath();

    ctx.moveTo(
        x - 20,
        y
    );

    ctx.lineTo(
        x + w / 2,
        y - 55
    );

    ctx.lineTo(
        x + w + 20,
        y
    );

    ctx.closePath();

    ctx.fill();


    // WINDOWS

    ctx.fillStyle =
        "#ffffff";

    for (
        let wx = x + 35;
        wx < x + w - 25;
        wx += 70
    ) {

        for (
            let wy = y + 65;
            wy < y + h - 40;
            wy += 65
        ) {

            ctx.fillRect(
                wx,
                wy,
                38,
                30
            );

        }

    }


    // SIGN

    ctx.fillStyle =
        "rgba(255,255,255,.95)";

    ctx.fillRect(
        x + 20,
        y + h - 50,
        w - 40,
        38
    );


    ctx.fillStyle =
        "#333";

    ctx.font =
        "bold 18px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        icon + " " + name,
        x + w / 2,
        y + h - 24
    );

}


// ========================================
// TREE
// ========================================

function drawTree(x,y) {

    // SHADOW

    ctx.fillStyle =
        "rgba(0,0,0,.15)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y + 40,
        38,
        15,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // TRUNK

    ctx.fillStyle =
        "#8b5a35";

    ctx.fillRect(
        x - 9,
        y + 5,
        18,
        45
    );


    // TREE TOP

    ctx.fillStyle =
        "#3fae55";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        38,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle =
        "#55c967";

    ctx.beginPath();

    ctx.arc(
        x - 18,
        y - 10,
        25,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


// ========================================
// PLAYER
// ========================================

function drawPlayer() {

    const x = player.x;
    const y = player.y;

    // PLAYER SHADOW
    ctx.fillStyle = "rgba(0,0,0,.25)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y + 10,
        38,
        14,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // SELECTED CHARACTER
    const hero = characterImages[selectedCharacter];

    if (hero && hero.complete && hero.naturalWidth > 0) {

        const width = 90;
        const height = 135;

        ctx.drawImage(
            hero,
            x - width / 2,
            y - height + 12,
            width,
            height
        );

    } else {

        // Temporary fallback while image loads
        ctx.fillStyle = "#6c3cff";

        ctx.beginPath();

        ctx.arc(
            x,
            y - 25,
            20,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

    // PLAYER NAME
    const names = {
        seth: "Seth",
        sarah: "Sarah",
        annie: "Annie",
        archie: "Archie"
    };

    ctx.fillStyle = "#ffffff";

    ctx.font = "bold 15px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
        names[selectedCharacter] || "Hero",
        x,
        y + 32
    );
}


// ========================================
// UPDATE PLAYER
// ========================================

function updatePlayer() {

    if (
        keys["w"] ||
        keys["arrowup"]
    ) {

        player.y -=
            player.speed;

    }

    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {

        player.y +=
            player.speed;

    }

    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        player.x -=
            player.speed;

    }

    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        player.x +=
            player.speed;

    }


    // WORLD BOUNDARIES

    player.x =
        Math.max(
            30,
            Math.min(
                WORLD_WIDTH - 30,
                player.x
            )
        );

    player.y =
        Math.max(
            30,
            Math.min(
                WORLD_HEIGHT - 30,
                player.y
            )
        );


    // CAMERA FOLLOW

    camera.x =
        player.x -
        canvas.width / 2;

    camera.y =
        player.y -
        canvas.height / 2;


    // CAMERA LIMITS

    camera.x =
        Math.max(
            0,
            Math.min(
                WORLD_WIDTH -
                canvas.width,
                camera.x
            )
        );

    camera.y =
        Math.max(
            0,
            Math.min(
                WORLD_HEIGHT -
                canvas.height,
                camera.y
            )
        );

}


// ========================================
// DRAW
// ========================================

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.save();


    // CAMERA

    ctx.translate(
        -camera.x,
        -camera.y
    );


    drawWorld();

    drawPlayer();


    ctx.restore();

}


// ========================================
// GAME LOOP
// ========================================

function gameLoop() {

    updatePlayer();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


/* ========================================
   TQ QUEST — HERO SELECTION
======================================== */

let selectedCharacter = "";

const characterCards = document.querySelectorAll(".characterCard");
const characterSelect = document.getElementById("characterSelect");
const startQuestButton = document.getElementById("startQuest");

characterCards.forEach(function(card) {

    card.addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        // Remove previous selection
        characterCards.forEach(function(otherCard) {
            otherCard.classList.remove("selected");
        });

        // Select this hero
        card.classList.add("selected");

        // Save selected hero
        selectedCharacter = card.getAttribute("data-character");

        console.log("Selected hero:", selectedCharacter);

    });

});


startQuestButton.addEventListener("click", function(event) {

    event.preventDefault();
    event.stopPropagation();

    // Make sure a hero was selected
    if (!selectedCharacter) {

        alert("Please choose your hero first!");

        return;

    }

    console.log("Starting TQ QUEST as:", selectedCharacter);

    // Hide character selection
    characterSelect.style.display = "none";

    // Make sure the game is visible
    canvas.style.display = "block";

});
gameLoop();
</script>

</body>
</html>
