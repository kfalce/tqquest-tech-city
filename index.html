<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TQ QUEST — Tech City</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
        }

        #game {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #hud {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 10;

            padding: 12px 18px;

            background: rgba(0, 0, 0, 0.75);
            color: white;

            border-radius: 12px;

            font-size: 16px;
        }
    </style>
</head>

<body>

    <div id="hud">
        ⭐ XP: <span id="xp">0</span>
        &nbsp;&nbsp;
        🪙 Coins: <span id="coins">0</span>
    </div>

    <canvas id="game"></canvas>

    <script>

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

        }

        window.addEventListener("resize", resizeCanvas);

        resizeCanvas();

        // PLAYER
        const player = {

            x: canvas.width / 2,
            y: canvas.height / 2,

            size: 30,

            speed: 5

        };

        // GAME DATA
        let xp = 0;
        let coins = 0;

        // KEYBOARD
        const keys = {};

        window.addEventListener("keydown", function(event) {

            keys[event.key.toLowerCase()] = true;

        });

        window.addEventListener("keyup", function(event) {

            keys[event.key.toLowerCase()] = false;

        });

        // DRAW
        function draw() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            // BACKGROUND
            ctx.fillStyle = "#151022";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            // GRID
            ctx.strokeStyle = "#292044";
            ctx.lineWidth = 1;

            const gridSize = 50;

            for (
                let x = 0;
                x < canvas.width;
                x += gridSize
            ) {

                ctx.beginPath();

                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);

                ctx.stroke();

            }

            for (
                let y = 0;
                y < canvas.height;
                y += gridSize
            ) {

                ctx.beginPath();

                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);

                ctx.stroke();

            }

            // PLAYER
            ctx.fillStyle = "#22dfff";

            ctx.beginPath();

            ctx.arc(
                player.x,
                player.y,
                player.size / 2,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }

        // UPDATE
        function update() {

            if (keys["w"] || keys["arrowup"]) {

                player.y -= player.speed;

            }

            if (keys["s"] || keys["arrowdown"]) {

                player.y += player.speed;

            }

            if (keys["a"] || keys["arrowleft"]) {

                player.x -= player.speed;

            }

            if (keys["d"] || keys["arrowright"]) {

                player.x += player.speed;

            }

            // KEEP PLAYER ON SCREEN

            player.x = Math.max(
                player.size / 2,
                Math.min(
                    canvas.width - player.size / 2,
                    player.x
                )
            );

            player.y = Math.max(
                player.size / 2,
                Math.min(
                    canvas.height - player.size / 2,
                    player.y
                )
            );

            document.getElementById("xp").textContent = xp;
            document.getElementById("coins").textContent = coins;

        }

        // GAME LOOP
        function gameLoop() {

            update();

            draw();

            requestAnimationFrame(gameLoop);

        }

        gameLoop();

    </script>

</body>
</html>
