<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TQ QUEST — Tech City</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #79c9ff;
}

canvas {
    display: block;
}

#hud {

    position: fixed;

    top: 15px;
    left: 15px;

    z-index: 10;

    background: rgba(255,255,255,.94);

    padding: 12px 18px;

    border-radius: 18px;

    box-shadow:
        0 5px 15px rgba(0,0,0,.2);

    font-weight: bold;

    color: #263238;

}

#title {

    font-size: 18px;

    color: #6c3cff;

    margin-bottom: 5px;

}

#controls {

    position: fixed;

    bottom: 15px;
    left: 15px;

    z-index: 10;

    background: rgba(255,255,255,.9);

    padding: 10px 15px;

    border-radius: 15px;

    font-size: 13px;

    color: #444;

}

#location {

    position: fixed;

    top: 15px;
    right: 15px;

    z-index: 10;

    background: rgba(255,255,255,.94);

    padding: 10px 16px;

    border-radius: 16px;

    font-weight: bold;

    color: #444;

}

</style>
</head>

<body>

<div id="hud">

    <div id="title">
        🎮 TQ QUEST
    </div>

    ⭐ XP:
    <span id="xp">0</span>

    &nbsp;&nbsp;

    🪙 Coins:
    <span id="coins">0</span>

</div>

<div id="location">
    🏙️ TECH CITY
</div>

<div id="controls">
    ⌨️ WASD / Arrow Keys to move
</div>

<canvas id="game"></canvas>

<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


// ========================================
// CANVAS
// ========================================

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


// ========================================
// WORLD
// ========================================

const WORLD_WIDTH = 2400;
const WORLD_HEIGHT = 1800;


// ========================================
// CAMERA
// ========================================

const camera = {

    x: 0,
    y: 0

};


// ========================================
// PLAYER
// ========================================

const player = {

    x: 1200,
    y: 900,

    size: 34,

    speed: 5

};


// ========================================
// GAME DATA
// ========================================

let xp = 0;
let coins = 0;


// ========================================
// KEYBOARD
// ========================================

const keys = {};

window.addEventListener(
    "keydown",
    function(event) {

        keys[event.key.toLowerCase()] = true;

    }
);

window.addEventListener(
    "keyup",
    function(event) {

        keys[event.key.toLowerCase()] = false;

    }
);


// ========================================
// BUILDINGS
// ========================================

const buildings = [

    {
        x: 1010,
        y: 400,
        w: 380,
        h: 230,
        color: "#ffcc66",
        roof: "#ff8a5b",
        name: "TRAINING HQ",
        icon: "🏢"
    },

    {
        x: 400,
        y: 650,
        w: 300,
        h: 220,
        color: "#ff8fcf",
        roof: "#e84f9d",
        name: "TQ SHOP",
        icon: "🏪"
    },

    {
        x: 1700,
        y: 650,
        w: 320,
        h: 220,
        color: "#75d6ff",
        roof: "#3498db",
        name: "POWER STATION",
        icon: "⚡"
    },

    {
        x: 400,
        y: 1150,
        w: 330,
        h: 230,
        color: "#9fe58b",
        roof: "#55b948",
        name: "TRAINING CENTER",
        icon: "🧠"
    },

    {
        x: 1650,
        y: 1150,
        w: 370,
        h: 240,
        color: "#b89cff",
        roof: "#7856d6",
        name: "BATTLE ARENA",
        icon: "🏆"
    }

];


// ========================================
// TREES
// ========================================

const trees = [

    [180,180],
    [350,300],
    [600,180],
    [900,200],
    [1500,190],
    [1900,250],
    [2200,200],

    [180,1000],
    [300,1500],
    [800,1500],
    [1100,1450],
    [1450,1500],
    [2100,1500],
    [2250,1100]

];


// ========================================
// DRAW WORLD
// ========================================

function drawWorld() {

    // GRASS

    ctx.fillStyle =
        "#8ed081";

    ctx.fillRect(
        0,
        0,
        WORLD_WIDTH,
        WORLD_HEIGHT
    );


    // LIGHTER GRASS PATCHES

    ctx.fillStyle =
        "#a5df91";

    for (
        let x = 0;
        x < WORLD_WIDTH;
        x += 300
    ) {

        for (
            let y = 0;
            y < WORLD_HEIGHT;
            y += 300
        ) {

            ctx.fillRect(
                x,
                y,
                150,
                150
            );

        }

    }


    // MAIN ROADS

    ctx.fillStyle =
        "#d9d9d9";

    // Horizontal

    ctx.fillRect(
        0,
        820,
        WORLD_WIDTH,
        160
    );

    // Vertical

    ctx.fillRect(
        1120,
        0,
        160,
        WORLD_HEIGHT
    );


    // ROAD CENTER LINES

    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth = 8;

    ctx.setLineDash([
        35,
        25
    ]);


    ctx.beginPath();

    ctx.moveTo(
        0,
        900
    );

    ctx.lineTo(
        WORLD_WIDTH,
        900
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        1200,
        0
    );

    ctx.lineTo(
        1200,
        WORLD_HEIGHT
    );

    ctx.stroke();


    ctx.setLineDash([]);


    // SIDEWALKS

    ctx.fillStyle =
        "#eeeeee";

    ctx.fillRect(
        0,
        805,
        WORLD_WIDTH,
        15
    );

    ctx.fillRect(
        0,
        980,
        WORLD_WIDTH,
        15
    );

    ctx.fillRect(
        1105,
        0,
        15,
        WORLD_HEIGHT
    );

    ctx.fillRect(
        1280,
        0,
        15,
        WORLD_HEIGHT
    );


    // BUILDINGS

    buildings.forEach(
        drawBuilding
    );


    // TREES

    trees.forEach(
        tree => drawTree(
            tree[0],
            tree[1]
        )
    );

}


// ========================================
// BUILDING
// ========================================

function drawBuilding(building) {

    const {

        x,
        y,
        w,
        h,
        color,
        roof,
        name,
        icon

    } = building;


    // SHADOW

    ctx.fillStyle =
        "rgba(0,0,0,.18)";

    ctx.fillRect(
        x + 12,
        y + 14,
        w,
        h
    );


    // BUILDING

    ctx.fillStyle =
        color;

    ctx.fillRect(
        x,
        y,
        w,
        h
    );


    // ROOF

    ctx.fillStyle =
        roof;

    ctx.beginPath();

    ctx.moveTo(
        x - 20,
        y
    );

    ctx.lineTo(
        x + w / 2,
        y - 55
    );

    ctx.lineTo(
        x + w + 20,
        y
    );

    ctx.closePath();

    ctx.fill();


    // WINDOWS

    ctx.fillStyle =
        "#ffffff";

    for (
        let wx = x + 35;
        wx < x + w - 25;
        wx += 70
    ) {

        for (
            let wy = y + 65;
            wy < y + h - 40;
            wy += 65
        ) {

            ctx.fillRect(
                wx,
                wy,
                38,
                30
            );

        }

    }


    // SIGN

    ctx.fillStyle =
        "rgba(255,255,255,.95)";

    ctx.fillRect(
        x + 20,
        y + h - 50,
        w - 40,
        38
    );


    ctx.fillStyle =
        "#333";

    ctx.font =
        "bold 18px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        icon + " " + name,
        x + w / 2,
        y + h - 24
    );

}


// ========================================
// TREE
// ========================================

function drawTree(x,y) {

    // SHADOW

    ctx.fillStyle =
        "rgba(0,0,0,.15)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y + 40,
        38,
        15,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // TRUNK

    ctx.fillStyle =
        "#8b5a35";

    ctx.fillRect(
        x - 9,
        y + 5,
        18,
        45
    );


    // TREE TOP

    ctx.fillStyle =
        "#3fae55";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        38,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle =
        "#55c967";

    ctx.beginPath();

    ctx.arc(
        x - 18,
        y - 10,
        25,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


// ========================================
// PLAYER
// ========================================

function drawPlayer() {

    const x =
        player.x;

    const y =
        player.y;


    // SHADOW

    ctx.fillStyle =
        "rgba(0,0,0,.25)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y + 18,
        23,
        10,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // BODY

    ctx.fillStyle =
        "#6c3cff";

    ctx.fillRect(
        x - 15,
        y - 5,
        30,
        35
    );


    // HEAD

    ctx.fillStyle =
        "#ffd0a6";

    ctx.beginPath();

    ctx.arc(
        x,
        y - 20,
        18,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // HAIR

    ctx.fillStyle =
        "#4a2b1a";

    ctx.beginPath();

    ctx.arc(
        x,
        y - 27,
        18,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();


    // HEADSET

    ctx.strokeStyle =
        "#222";

    ctx.lineWidth =
        5;

    ctx.beginPath();

    ctx.arc(
        x,
        y - 20,
        20,
        Math.PI,
        Math.PI * 2
    );

    ctx.stroke();


    // EYES

    ctx.fillStyle =
        "#222";

    ctx.beginPath();

    ctx.arc(
        x - 6,
        y - 21,
        2.5,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 6,
        y - 21,
        2.5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // PLAYER NAME

    ctx.fillStyle =
        "#333";

    ctx.font =
        "bold 14px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "PLAYER",
        x,
        y + 55
    );

}


// ========================================
// UPDATE PLAYER
// ========================================

function updatePlayer() {

    if (
        keys["w"] ||
        keys["arrowup"]
    ) {

        player.y -=
            player.speed;

    }

    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {

        player.y +=
            player.speed;

    }

    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        player.x -=
            player.speed;

    }

    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        player.x +=
            player.speed;

    }


    // WORLD BOUNDARIES

    player.x =
        Math.max(
            30,
            Math.min(
                WORLD_WIDTH - 30,
                player.x
            )
        );

    player.y =
        Math.max(
            30,
            Math.min(
                WORLD_HEIGHT - 30,
                player.y
            )
        );


    // CAMERA FOLLOW

    camera.x =
        player.x -
        canvas.width / 2;

    camera.y =
        player.y -
        canvas.height / 2;


    // CAMERA LIMITS

    camera.x =
        Math.max(
            0,
            Math.min(
                WORLD_WIDTH -
                canvas.width,
                camera.x
            )
        );

    camera.y =
        Math.max(
            0,
            Math.min(
                WORLD_HEIGHT -
                canvas.height,
                camera.y
            )
        );

}


// ========================================
// DRAW
// ========================================

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.save();


    // CAMERA

    ctx.translate(
        -camera.x,
        -camera.y
    );


    drawWorld();

    drawPlayer();


    ctx.restore();

}


// ========================================
// GAME LOOP
// ========================================

function gameLoop() {

    updatePlayer();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();

</script>

</body>
</html>
